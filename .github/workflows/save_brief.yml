name: Fetch SAVE Brief

on:
  schedule:
    # 평일 22:00 KST = 13:00 UTC (월-금)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:  # 수동 실행

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra save-brief

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run fetch_save_brief
        env:
          SAVE_EMAIL: ${{ secrets.SAVE_EMAIL }}
          SAVE_PASSWORD: ${{ secrets.SAVE_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TZ: Asia/Seoul
        run: uv run python scripts/fetch_save_brief.py

      # data/SAVE/ 는 유료 구독 콘텐츠라 리포에 커밋하지 않는다 (.gitignore /data/SAVE/).
      # 브리핑은 워크플로우 아티팩트로만 보존 — 파이프라인은 SAVE 부재 시 우아하게 생략한다.
      - name: Upload brief as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: save-brief
          path: data/SAVE/
          retention-days: 30
          if-no-files-found: ignore
